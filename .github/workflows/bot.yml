name: Slack Escalation Automation

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOT_USER_ID: ${{ vars.BOT_USER_ID }}
          BOT_NAME: ${{ vars.BOT_NAME }}
          CHANNEL_IDS: ${{ vars.CHANNEL_IDS }}
          ESCALATION_GROUP_ID: ${{ vars.ESCALATION_GROUP_ID }}
          ONCALL_GROUP_ID: ${{ vars.ONCALL_GROUP_ID }}
          TEST_MODE: "false"
        run: python bot.py

      - name: Comit State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update bot state [skip ci]"
          git push